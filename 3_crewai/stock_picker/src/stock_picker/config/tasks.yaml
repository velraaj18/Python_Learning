find_trending_companies:
  description: >
    Find the top trending companies in the news in {sector} by searching the latest news. Find new companies that you've not found before.
  expected_output: >
    A list of trending companies in {sector}
  agent: trending_company_finder
  output_file: output/trending_companies.json

  find_best_company:
    description: >
      Analyze the list of trending companies generated by the previous task.
      Compare each company based on its recent news, growth potential, market position,
      competitive advantages, and overall investment outlook.
      Select the single best company for investment and explain why it is superior
      to the other trending companies.
    expected_output: >
      A report containing:
        - Company name
        - Stock ticker
        - Summary of the company's recent news
        - Reasons for selecting it as the best investment
        - Potential risks
        - Overall investment recommendation
    agent: best_company_finder
    context:
      - find_trending_companies
    output_file: output/best_company_report.md
